name: pr-image

# Builds and pushes a multi-arch image for a PR so the change can be exercised on a
# real cluster before merge.
#
# This exists because release.yml is gated on
#   if: github.repository == 'numaproj/numaflow'
# so none of its build jobs run in this fork, and the fork therefore has no way to
# produce an artifact from a branch.
#
# The tag is built to be traceable years later:
#   <upstream base version>-pr<PR number>-<8 char head commit>
# e.g. v1.4.6-pr24-f4a9bc6d
# which identifies the upstream release the fork is based on, the PR carrying the
# change, and the exact commit built. The same provenance is written into OCI
# labels so it survives even if the tag is copied or re-pushed elsewhere.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to embed in the image tag"
        required: true

# Least privilege: read the tree, write the package. Nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: pr-image-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  image:
    name: build and push PR image
    runs-on: ubuntu-24.04
    # A PR from a fork gets no registry credentials, so it would fail late and
    # confusingly. Skip it rather than pretend.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Deliberately the head commit, not the pull_request merge commit, so the
          # SHA in the tag names something that actually exists on the branch.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Derive traceable tag
        id: meta
        run: |
          set -euo pipefail
          base=$(awk -F':=' '/^BASE_VERSION[[:space:]]*:=/{gsub(/[[:space:]]/,"",$2); print $2}' Makefile)
          if [ -z "$base" ]; then echo "could not read BASE_VERSION from Makefile" >&2; exit 1; fi
          pr="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          sha=$(git rev-parse --short=8 HEAD)
          tag="${base}-pr${pr}-${sha}"
          echo "base=${base}"                                                    >>"$GITHUB_OUTPUT"
          echo "pr=${pr}"                                                        >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)"                                       >>"$GITHUB_OUTPUT"
          echo "tag=${tag}"                                                      >>"$GITHUB_OUTPUT"
          echo "image=${REGISTRY_NAMESPACE}/numaflow:${tag}"                      >>"$GITHUB_OUTPUT"
        env:
          REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      # An absent secret interpolates to an empty string, docker/login-action
      # accepts it, and the failure only surfaces as a 403 on the final push -
      # roughly twenty minutes later, after the Rust cross-build. Check it up
      # front so a missing secret costs seconds instead. Read via env rather than
      # inlined into the script so the value is never part of the command line.
      - name: Check registry credential is present
        env:
          REGISTRY_PASSWORD: ${{ secrets.ORG_PAT_GITHUB }}
        run: |
          if [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "::error::secrets.ORG_PAT_GITHUB is empty or not exposed to this repository. Set it, or switch this step and the login below to a secret that exists (this repo has MY_PAT), or revert to secrets.GITHUB_TOKEN, which cannot write ghcr.io/<owner>/numaflow and needs IMAGE_NAMESPACE pointed at a repo-owned path such as ghcr.io/<owner>/pr-builds."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ORG_PAT_GITHUB }}

      - name: Build Rust binaries for both architectures
        # image-multi skips its own rust build when GITHUB_ACTIONS is set, because
        # upstream builds rust in separate per-arch jobs and passes artifacts in.
        # Invoking the target directly keeps this workflow to a single job.
        run: make build-rust-in-docker-multi

      - name: Build and push multi-arch image
        run: make image-multi
        env:
          # Publishes to the same package the released images live in. This only
          # works because the login above uses an org PAT: ghcr.io/<owner>/numaflow
          # predates this workflow and was created outside this repository, so it
          # is not linked to it, and the repo-scoped GITHUB_TOKEN gets a 403 on the
          # blob HEAD request no matter what `packages: write` says.
          #
          # Per-PR tags therefore sit alongside released ones in a single package.
          # The tag itself is what keeps them distinguishable - see the tag format
          # above - so nothing here is ambiguous, but a reader browsing tags will
          # see unmerged builds among them.
          IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.meta.outputs.tag }}
          DOCKER_PUSH: "true"
          # DOCKER_BUILD_ARGS is interpolated straight into the buildx invocation,
          # so it can carry labels as well as build args.
          DOCKER_BUILD_ARGS: >-
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            --label org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            --label org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            --label io.atlan.numaflow.upstream-base=${{ steps.meta.outputs.base }}
            --label io.atlan.numaflow.pull-request=${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.meta.outputs.pr }}

      - name: Report image reference
        run: |
          {
            echo "### PR image pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| upstream base | \`${{ steps.meta.outputs.base }}\` |"
            echo "| pull request | #${{ steps.meta.outputs.pr }} |"
            echo "| commit | \`${{ steps.meta.outputs.sha }}\` |"
            echo "| platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Deploy with:"
            echo '```'
            echo "kubectl set image -n numaflow deploy/numaflow-controller-deploy controller-manager=${{ steps.meta.outputs.image }}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
