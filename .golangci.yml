# golangci-lint v2 config. Uses the v2 default linters with the exclusion
# presets that correspond to golangci-lint v1's default exclusions, which this
# repo was linted with before, plus goimports.
version: "2"
linters:
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - goimports
